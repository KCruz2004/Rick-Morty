<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://rickandmortyapi.com; img-src 'self' https://rickandmortyapi.com; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title> Rick & Morty</title>
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <div class="eyebrow">APP DE ESCRITORIO</div>
        <h1>Rick & Morty</h1>
        <p>Explorá personajes, descubrí su origen y recorré el multiverso.</p>
    </header>
    <main>
        <form id="search"><label>Nombre<input id="query" placeholder="Rick, Morty…"
                    maxlength="100"></label><label>Estado<select id="statusFilter">
                    <option value="">Todos</option>
                    <option value="alive">Vivo</option>
                    <option value="dead">Muerto</option>
                    <option value="unknown">Desconocido</option>
                </select></label><label>Género<select id="gender">
                    <option value="">Todos</option>
                    <option value="female">Femenino</option>
                    <option value="male">Masculino</option>
                    <option value="genderless">Sin género</option>
                    <option value="unknown">Desconocido</option>
                </select></label><button type="submit">Buscar</button><button id="reset" type="button">Limpiar</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <section id="grid" aria-label="Resultados"></section>
        <nav aria-label="Paginación"><button id="prev" disabled>Anterior</button><span id="page"></span><button
                id="next" disabled>Siguiente</button></nav>
    </main>
    <footer>Proyecto académico · Datos de The Rick and Morty API · Requiere Internet para consultar</footer>
</body>

</html>
